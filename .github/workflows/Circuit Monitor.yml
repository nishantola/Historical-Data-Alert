name: Circuit Monitor

on:
  schedule:
  - cron: '30 1 * * *'
  

jobs:
  run-validator:
    runs-on: ubuntu-latest
    environment: production   # Required if using Environment secrets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Debug Secret Presence
        env:
          SLACK_WEBHOOK_CIRCUIT: ${{ secrets.SLACK_WEBHOOK_CIRCUIT}}
        run: |
          if [ -z "$SLACK_WEBHOOK_CIRCUIT" ]; then
            echo "Webhook is EMPTY"
            exit 1
          else
            echo "Webhook is SET"
          fi
      - name: Run Validator
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          SLACK_WEBHOOK_CIRCUIT: ${{ secrets.SLACK_WEBHOOK_CIRCUIT }}
        run: |
          python volume_circuit_monitor_v2.py
