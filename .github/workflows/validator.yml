name: Daily Historical Validator

on:
  schedule:
    - cron: '50 8 * * 1-5'
  workflow_dispatch:

jobs:
  run-validator:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Validator
        run: |
          python main.py
